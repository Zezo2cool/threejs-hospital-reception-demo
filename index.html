<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Hospital Reception Demo</title>

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="loading-screen" role="status" aria-live="polite">
      <p id="loading-message">The model is loading. Please wait...</p>
    </div>

    <button id="camera-reset" class="camera-reset" type="button">
      Reset view
    </button>
    <!-- Hotspot Information Panel  -->
    <aside id="info-panel" class="info-panel" hidden>
      <button
        id="info-close"
        type="button"
        aria-label="Close information panel"
      >
        x
      </button>
      <h2 id="info-title"></h2>
      <p id="info-description"></p>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
